name: Breather
options:
  bundleIdPrefix: com.romario333
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 59SZ26S92T
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  BreatherCore:
    path: Packages/BreatherCore
targets:
  Breather:
    type: application
    platform: macOS
    sources:
      - Breather
    dependencies:
      - package: BreatherCore
    info:
      path: Breather/Info.plist
      properties:
        CFBundleDisplayName: Breather
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHumanReadableCopyright: © 2026 Roman Mašek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romario333.breather
        PRODUCT_NAME: Breather
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Breather:
    build:
      targets:
        Breather: all
    run:
      config: Debug
    archive:
      config: Release
